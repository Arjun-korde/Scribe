name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  QT_VERSION: 6.8.3

jobs:
  build-test:
    name: ${{ matrix.preset }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          arch: win64_msvc2022_64
          cache: true

      - name: Load MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # A fresh clone, so the commit pinned by "builtin-baseline" in vcpkg.json is available.
      - name: Set up vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$env:RUNNER_TEMP\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Configure
        shell: pwsh
        run: |
          $env:CMAKE_PREFIX_PATH = $env:QT_ROOT_DIR
          cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        shell: pwsh
        run: |
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
          ctest --preset ${{ matrix.preset }}

  # Runs next to build-test instead of after it. clang-tidy only needs compile_commands.json and the
  # generated moc files (the tests include "*.moc"), so it builds just the autogen targets.
  lint:
    name: lint
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the clang-tidy step diffs against the pull request's base commit

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          arch: win64_msvc2022_64
          cache: true

      - name: Load MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$env:RUNNER_TEMP\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Configure
        shell: pwsh
        run: |
          $env:CMAKE_PREFIX_PATH = $env:QT_ROOT_DIR
          cmake --preset debug -DCMAKE_GLOBAL_AUTOGEN_TARGET=ON

      - name: Generate moc files
        run: cmake --build --preset debug --target autogen

      - name: Check formatting
        shell: pwsh
        run: |
          $files = git ls-files 'src/*.cpp' 'src/*.h' 'tests/*.cpp' 'tests/*.h'
          clang-format --dry-run -Werror $files

      - name: Static analysis (clang-tidy)
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # One clang-tidy process per file, several at a time. Run one after another this step took
          # about 12 minutes. Output is collected per file so the logs do not interleave.
          $root = (Get-Location).Path
          $files = git ls-files 'src/*.cpp' 'tests/*.cpp'

          # On pull requests only analyse what the PR touches. Pushes to main still check everything.
          if ($env:BASE_SHA) {
              $changed = @(git diff --name-only --diff-filter=ACMR "$env:BASE_SHA...HEAD")
              # A change to the analysis settings or the build can affect every file.
              $global = $changed | Where-Object { $_ -match '^(\.clang-tidy|CMakeLists\.txt|CMakePresets\.json|vcpkg\.json|\.github/workflows/ci\.yml)$' }
              if (-not $global) {
                  $headers = @($changed | Where-Object { $_ -match '^(src|tests)/.*\.h$' })
                  $selected = $files | Where-Object {
                      $file = $_
                      # The .cpp itself changed, or it includes a header that changed.
                      ($changed -contains $file) -or
                      ($headers | Where-Object { Select-String -Path $file -SimpleMatch -Pattern ('"' + (Split-Path $_ -Leaf) + '"') -Quiet -List })
                  }
                  $files = @($selected)
                  Write-Host "Pull request: analysing $($files.Count) of $(@(git ls-files 'src/*.cpp' 'tests/*.cpp').Count) files."
              }
              else {
                  Write-Host "Analysis settings or build files changed ($($global -join ', ')): analysing all files."
              }
          }
          if (-not $files) { Write-Host 'No C++ files to analyse.'; exit 0 }

          $results = $files | ForEach-Object -ThrottleLimit ([Environment]::ProcessorCount) -Parallel {
              Set-Location $using:root
              $output = clang-tidy -p build/debug --quiet $_ 2>&1 | Out-String
              [pscustomobject]@{ File = $_; ExitCode = $LASTEXITCODE; Output = $output }
          }
          $failed = $false
          foreach ($result in $results) {
              Write-Host "::group::$($result.File)"
              Write-Host $result.Output
              Write-Host '::endgroup::'
              if ($result.ExitCode -ne 0) {
                  Write-Host "::error::clang-tidy failed on $($result.File)"
                  $failed = $true
              }
          }
          if ($failed) { exit 1 }
